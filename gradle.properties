# sun.misc.Unsafe: androidx.datastore's bundled protobuf calls it at lint time on JDK 25; the warning
# comes from a third-party jar we cannot patch, so the access is allowed explicitly.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 --sun-misc-unsafe-memory-access=allow
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
